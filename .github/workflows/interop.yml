# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-sunspec against the independent SunSpec stacks otfabric/sunspec-interop
# publishes: pysunspec2, the SunSpec Alliance's Python stack, and cB-Sigma's Go
# sunspec and sunspec-sim. The images are consumed by digest
# (interop/interop_test.go): nothing of sunspec-interop is cloned or built here.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  # Keep in step with interop/interop_test.go (TestWorkflowPin).
  SUNSPEC_INTEROP_PYSUNSPEC2_IMAGE: ghcr.io/otfabric/sunspec-interop-pysunspec2:v0.3.0@sha256:0f34e284b3110c3123449a6c7390f9bc7860a50a2e54adc08245c994514a7e18
  SUNSPEC_INTEROP_CBSIGMA_IMAGE: ghcr.io/otfabric/sunspec-interop-cbsigma:v0.3.0@sha256:77c23c3fd3a6253ea25173e55f83238b076070ee53c051f493228c207d344d42

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: pysunspec2, cbsigma
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pull the images
        run: |
          for image in "${SUNSPEC_INTEROP_PYSUNSPEC2_IMAGE}" "${SUNSPEC_INTEROP_CBSIGMA_IMAGE}"; do
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "${image}" && break
              [[ "${attempt}" == 5 ]] && exit 1
              sleep $((attempt * 15))
            done
            docker run --rm "${image}" version | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Run the interop suite
        run: |
          set -o pipefail
          mkdir -p artifacts
          make interop INTEROP_TESTFLAGS=-v 2>&1 | tee artifacts/interop.log
          grep -E -- '^ *--- (PASS|FAIL|SKIP)' artifacts/interop.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop
          path: artifacts/
          if-no-files-found: ignore
